<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly — To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Taskly</span>
          <span class="brand-sub">To-Do List</span>
        </div>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <form class="composer" id="todo-form" autocomplete="off">
      <input
        class="composer-input"
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        maxlength="200"
        aria-label="New task">
      <button class="btn-add" type="submit" aria-label="Add task">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Add</span>
      </button>
    </form>

    <nav class="filters" id="filters" aria-label="Filter tasks">
      <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">
        All <span class="count" data-count="all">0</span>
      </button>
      <button class="filter" type="button" data-filter="active" aria-pressed="false">
        Active <span class="count" data-count="active">0</span>
      </button>
      <button class="filter" type="button" data-filter="completed" aria-pressed="false">
        Completed <span class="count" data-count="completed">0</span>
      </button>
    </nav>

    <main class="list-wrap">
      <ul class="list" id="todo-list"></ul>

      <div class="empty" id="empty-state">
        <div class="empty-art">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="3"/>
            <path d="M8 2v4M16 2v4M3 10h18"/>
            <path d="M9 15l2 2 4-4"/>
          </svg>
        </div>
        <p class="empty-title" id="empty-title">Nothing to do</p>
        <p class="empty-hint" id="empty-hint">Add your first task above to get started.</p>
      </div>
    </main>

    <footer class="footer">
      <span class="summary" id="summary">0 tasks left</span>
      <button class="link" type="button" id="clear-completed">Clear completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
